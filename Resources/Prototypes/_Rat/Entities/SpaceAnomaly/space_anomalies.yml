- type: entity
  id: RatSpaceAnomalyBase
  abstract: true
  components:
  - type: SpaceAnomaly
    studyPointReward: 50000
    scale: 4, 4
  - type: Anomaly
    minPulseLength: 45
    maxPulseLength: 90
  - type: ScaleVisuals
    scale: 4, 4
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 1.4
        density: 50
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: PointLight
    radius: 12
    energy: 8
    castShadows: false

- type: entity
  id: RatSpaceAnomalyGravity
  parent: [AnomalyGravity, RatSpaceAnomalyBase]
  name: space gravity anomaly
  components:
  - type: SpaceAnomaly
    typeName: space-anomaly-type-gravity
    behavior: Gravity
    studyPointReward: 50000

