- type: entity
  parent: AnomalyLocator
  id: RatSpaceAnomalyFieldScanner
  name: space anomaly field scanner
  description: Detects large anomalies drifting in open space. Works aboard shuttles.
  components:
  - type: SpaceAnomalyFieldScanner
    range: 50
  - type: ProximityDetector
    range: 50
    criteria:
      components:
      - SpaceAnomaly

- type: entity
  parent: BaseComputerAiAccess
  id: RatSpaceAnomalyStudyConsole
  name: space anomaly study console
  description: Shuttle-mounted console for cataloguing and studying cosmic anomalies.
  components:
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: rdcomp
    - map: ["computerLayerKeys"]
      state: rd_key
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: ResearchClient
  - type: SpaceAnomalyStudyConsole
    detectionRange: 90
    phaseTolerance: 10
  - type: ActivatableUI
    key: enum.SpaceAnomalyStudyUiKey.Key
  - type: UserInterface
    interfaces:
      enum.SpaceAnomalyStudyUiKey.Key:
        type: SpaceAnomalyStudyConsoleBui
      enum.ResearchClientUiKey.Key:
        type: ResearchClientBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: ApcPowerReceiver
    powerLoad: 800
  - type: Computer
    board: ResearchComputerCircuitboard
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#9b59b6"
