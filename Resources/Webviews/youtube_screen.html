<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
    iframe { border: 0; width: 100%; height: 100%; }
  </style>
</head>
<body>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  const id = params.get('v');
  if (!id || id.length !== 11) return;

  const play = params.get('play') === '1' ? '1' : '0';
  const origin = encodeURIComponent('https://localhost');
  const widgetReferrer = encodeURIComponent('https://localhost/');
  const src =
    'https://www.youtube.com/embed/' + id +
    '?autoplay=' + play +
    '&mute=1&controls=0&modestbranding=1&rel=0&playsinline=1&fs=0' +
    '&origin=' + origin +
    '&widget_referrer=' + widgetReferrer;

  const iframe = document.createElement('iframe');
  iframe.src = src;
  iframe.referrerPolicy = 'strict-origin-when-cross-origin';
  iframe.allow = 'autoplay; encrypted-media; picture-in-picture';
  iframe.allowFullscreen = true;
  document.body.appendChild(iframe);
})();
</script>
</body>
</html>
